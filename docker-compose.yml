services:
  db:
    image: mariadb:10.11.15
    container_name: mariadb_lokal
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma_docker
    links:
      - db
    ports:
      - "8080:80" # Akses di browser lewat localhost:8080
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 500M      # <--- Tambah ini (Batas upload 500MB)
      MEMORY_LIMIT: 512M      # <--- Tambah ini (Batas memory)
      MAX_EXECUTION_TIME: 600 # <--- Tambah ini (Waktu tunggu